
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteXL Navbar</title>

    <style>
        body {
            background-color: #1b1b1b;
        }

        .container {
            width: 95%;
            margin: 58px auto;
            background-color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }


        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 35px 30px 6px;
            border-bottom: 1px solid #eeeeee;
        }

        .logo {
            color: #159447;
            font-size: 24px;
            font-weight: bold;
        }

        .main-menu {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .main-menu a {
            color: #202830;
            font-size: 14px;
            font-weight: bold;
        }

        .signin {
            background-color: #202b35;
            color: white;
            border: none;
            padding: 9px 17px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
        }

        .sub-navbar {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 10px;
        }

        .sub-menu {
            display: flex;
            align-items: center;
            gap: 26px;
            flex-wrap: wrap;
        }

        .sub-menu a {
            text-decoration: none;
            color: #202830;
            font-size: 12px;
        }
        .container {
                margin: 25px auto;
            }
    </style>
</head>

<body>

    <div class="container">

        <div class="navbar">
            <div class="logo">ByteXL</div>

            <ul class="main-menu">
                <li>Courses</li>
                <li>Tutorials</li>
                <li>Practice</li>
                <li>Jobs</li>
            </ul>

            <button class="signin">Sign In</button>
        </div>

        <nav class="sub-navbar">
            <ul class="sub-menu">
                <li>DSA</li>
                <li>Practice Problems</li>
                <li>C</li>
                <li>C++</li>
                <li>Java</li>
                <li>Python</li>
                <li>JavaScript</li>
                <li>Data Science</li>
                <li>Machine Learning</li>
                <li>Courses</li>
                <li>Linux</li>
                <li>DevOps</li>
            </ul>
        </nav>

    </div>

</body>
</html>
